apply plugin: 'com.android.application'

def final appName = "otofun++"
project.ext {
    defaultApplicationId = "com.vn.otofun"
}

android {
    signingConfigs {
        release {
            storeFile file("../otofun.jks")
            storePassword "13112015"
            keyAlias "13112015"
            keyPassword "13112015"
        }
    }
    compileSdkVersion 31
    useLibrary 'org.apache.http.legacy'
    defaultConfig {
        applicationId defaultApplicationId
        minSdkVersion 23
        targetSdkVersion 31
        versionCode 7
        versionName "1.0.2"

        manifestPlaceholders = [manifestApplicationId: "com.vn.otofun",
                                onesignal_app_id: "6a4f6103-564b-44b9-b007-b2bd36798493",
                                onesignal_google_project_number: "430199382764"]

    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "IS_TEST", "true"

            def useDevServer = true
            if (useDevServer) {
//                applicationIdSuffix = ".debug"
                manifestPlaceholders = [applicationIdWithSuffix: "${defaultApplicationId}.debug"]
                buildConfigField "String", "DEFAULT_SECRET_KEY", "\"xxx\""
                buildConfigField "String", "BASIC_AUTH_USERNAME", "\"xxx\""
                buildConfigField "String", "BASIC_AUTH_PASSWORD", "\"xxx\""
                buildConfigField "String", "MAIN_URL", "\"http://otofun.vn\""
                buildConfigField "String", "AUTHORITY", "\"${defaultApplicationId}.debug.provider\""
                resValue "string", "app_name", "$appName"
                resValue "string", "authority", "${defaultApplicationId}.debug.provider"
            } else {
//                applicationIdSuffix = ".live"
                manifestPlaceholders = [applicationIdWithSuffix: "${defaultApplicationId}.live"]
                buildConfigField "String", "DEFAULT_SECRET_KEY", "\"xxx\""
                buildConfigField "String", "BASIC_AUTH_USERNAME", "\"xxx\""
                buildConfigField "String", "BASIC_AUTH_PASSWORD", "\"xxx\""
                buildConfigField "String", "MAIN_URL", "\"http://otofun.vn\""
                buildConfigField "String", "AUTHORITY", "\"${defaultApplicationId}.live.provider\""
                resValue "string", "app_name", "$appName"
                resValue "string", "authority", "${defaultApplicationId}.live.provider"
            }
        }
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            manifestPlaceholders = [applicationIdWithSuffix: "${defaultApplicationId}"]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "IS_TEST", "false"
            buildConfigField "String", "DEFAULT_SECRET_KEY", "\"xxx\""
            buildConfigField "String", "BASIC_AUTH_USERNAME", "\"xxx\""
            buildConfigField "String", "BASIC_AUTH_PASSWORD", "\"xxx\""
            buildConfigField "String", "MAIN_URL", "\"https://otofun.vn\""
            buildConfigField "String", "AUTHORITY", "\"${defaultApplicationId}.provider\""
            resValue "string", "app_name", appName
            resValue "string", "authority", "${defaultApplicationId}.provider"

            applicationVariants.all { variant ->
                variant.outputs.each { output ->
//                    def formattedDate = new Date().format('yyyyMMdd')
//                    def newName = output.outputFile.name
//                    newName = newName.replace("app-", "$appName-") //"MyAppName" -> I set my app variables in the root project
//                    newName = newName.replace("-release", "-$versionName-" + formattedDate)
//                    //noinspection GroovyAssignabilityCheck
//                    output.outputFileName = new File(output.outputFile.parent, newName)
                }
            }
        }
    }
    namespace 'com.vn.otofun'
}
repositories {
    maven { url "https://jitpack.io" }
}


